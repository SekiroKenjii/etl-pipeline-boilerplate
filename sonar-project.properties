# SonarQube / SonarCloud analysis of the project. CI runs it (the `sonar` job
# of .github/workflows/ci.yml) when the repository has a SONAR_TOKEN secret
# and a SONAR_HOST_URL variable, and fails on the quality gate.
#
# Quality profile: Sonar way, with ONE rule changed, which this file cannot
# set: the profile lives on the server (a copy of Sonar way, made the
# project's profile), so say it here.
#   python:S3776 (cognitive complexity): 30, where Sonar way says 15. Some
#   functions are over 15: the run kernel and the step orchestrator decide
#   retry, resume, lock and cancellation in one place, and the workbook
#   reader walks sheets of many shapes. 30 accepts them as they are rather
#   than splitting them for the number; it hides complexity, it does not
#   remove it, and lowering it back to 15 is the aim as they are split.
# Every other rule is Sonar way's. The Dockerfile and the manifests of deploy/
# (Kubernetes, the Airflow pods) are analysed with "Sonar way comprehensive",
# the profile with every rule of Docker and Kubernetes, set as the default of
# both languages on the server. .github is a source so that the analysis
# sees dependabot.yml: Dependabot moves the tag and the digest of the base
# images together, which is why the Dockerfile pins both (docker:S8431).
# No issue is marked "won't fix" or "false positive" on the server without a
# comment saying why.
#
# One rule is set aside on three classes, below: python:S6792 (use the PEP 695
# `class X[T]` syntax). These classes declare their variance with TypeVars,
# which PEP 695 cannot state, and the type checkers cannot yet infer:
#   - RejectedRecord (covariant) and CheckSet (contravariant) are dataclasses;
#     on Python 3.13+ pyright adds `__replace__(self, *, field: T)` to them and
#     infers the parameter invariant, so `CheckSet[RawUser]` would no longer be
#     a `CheckSet[Never]`.
#   - IDataTransformer: mypy infers both parameters invariant because `then`
#     returns `IDataTransformer[TIn, TNext]`.
# Weakening the types to please the syntax rule would let wrong pipelines
# type-check. Drop these entries once pyright and mypy infer the variance.
sonar.issue.ignore.multicriteria=variance1,variance2,variance3
sonar.issue.ignore.multicriteria.variance1.ruleKey=python:S6792
sonar.issue.ignore.multicriteria.variance1.resourceKey=src/core/contract/quality.py
sonar.issue.ignore.multicriteria.variance2.ruleKey=python:S6792
sonar.issue.ignore.multicriteria.variance2.resourceKey=src/core/quality/gate.py
sonar.issue.ignore.multicriteria.variance3.ruleKey=python:S6792
sonar.issue.ignore.multicriteria.variance3.resourceKey=src/core/pipeline/transformer.py
sonar.projectKey=etl-pipeline-boilerplate
sonar.projectName=etl-pipeline-boilerplate
# SonarCloud: the organization too.
# sonar.organization=<organization>
sonar.sources=src,scripts,benchmarks,deploy,Dockerfile,.github
sonar.tests=tests
sonar.python.version=3.14
sonar.exclusions=**/__pycache__/**,**/*.pyc
sonar.sourceEncoding=UTF-8
# Coverage of `make cov-db` (CI's Test step): every database, the `etl`
# processes of the end-to-end tests included. `make cov` writes the same file
# from the SQLite tests only, which covers less.
sonar.python.coverage.reportPaths=var/coverage.xml
