name: Release

# A tag v<version> publishes that version: the wheel and the SBOMs on the
# GitHub release, the image on the GitHub Container Registry, by version
# only (no `latest`: deployments name a digest). The image is scanned before
# it is pushed, then signed (cosign, keyless) and attested (SLSA build
# provenance and SBOM): `docs/deployment.md` shows how to verify them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"
  CONTAINER: docker

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the image, its signature and attestations on ghcr.io
      id-token: write # keyless signing: the workflow's OIDC identity
      attestations: write # build provenance and SBOM attestations
      artifact-metadata: write # their storage records
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: The tag is the version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, pyproject.toml $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Checks
        run: |
          uv sync --all-extras --frozen
          make check
          make security
      - name: Wheel
        run: uv build
      # Built, scanned and described before anything is pushed: a fixable
      # high or critical vulnerability stops the release here.
      - name: Image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          IMAGE_ARGS: >-
            --label org.opencontainers.image.version=${{ env.VERSION }}
            --label org.opencontainers.image.revision=${{ github.sha }}
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        run: |
          make image
          make image-scan
          make image-sbom
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          docker push "$IMAGE_NAME:$VERSION"
          # The digest the registry holds: what is signed and deployed.
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        run: cosign sign --yes "$IMAGE_NAME@$DIGEST"
      - name: Image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Image SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: var/image.cdx.json
          push-to-registry: true
      - name: Wheel provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            awk "/^## \\[$VERSION\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md
            echo
            echo "## Image"
            echo
            echo "Deploy it by digest:"
            echo
            echo '```sh'
            echo "kustomize edit set image etl-pipeline=$IMAGE_NAME:$VERSION@$DIGEST"
            echo "cosign verify $IMAGE_NAME@$DIGEST \\"
            echo "  --certificate-identity-regexp '^$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://$IMAGE_NAME@$DIGEST --repo $GITHUB_REPOSITORY"
            echo '```'
          } > var/notes.md
          cat var/notes.md >> "$GITHUB_STEP_SUMMARY"
          cp var/sbom.cdx.json var/python.cdx.json
          gh release create "$GITHUB_REF_NAME" dist/* var/python.cdx.json \
            var/image.cdx.json --title "$GITHUB_REF_NAME" --notes-file var/notes.md
