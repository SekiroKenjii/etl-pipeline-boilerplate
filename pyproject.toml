[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "etl-pipeline-boilerplate"
version = "0.1.0"
description = "A boilerplate for ETL and data migration pipelines in Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Thuong Vo", email = "trungthuongvo109@gmail.com" }]
keywords = ["etl", "data-pipeline", "data-migration", "data-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
# `core` and `shared` need nothing beyond the standard library.
dependencies = []

[project.optional-dependencies]
# One extra per `infra` connector family.
http = ["httpx>=0.28"]
mappings = ["openpyxl>=3.1"]
gcs = ["google-cloud-storage>=2.18"]
# Secret managers, for `${gcp:...}` and `${azure:...}` placeholders; `${vault:...}`
# needs the `http` extra.
gcp-secrets = ["google-cloud-secret-manager>=2.20"]
azure-secrets = ["azure-keyvault-secrets>=4.8", "azure-identity>=1.17"]
# Relational databases, through SQLAlchemy Core; one extra per driver.
sql = ["sqlalchemy>=2.0.41", "alembic>=1.16"]
postgres = ["etl-pipeline-boilerplate[sql]", "psycopg[binary]>=3.2"]
mssql = ["etl-pipeline-boilerplate[sql]", "mssql-python>=1.0"]
oracle = ["etl-pipeline-boilerplate[sql]", "oracledb>=2.5"]
mysql = ["etl-pipeline-boilerplate[sql]", "pymysql>=1.1"]
mongodb = ["pymongo>=4.10"]
# Kafka topics, Debezium change events among them.
kafka = ["confluent-kafka>=2.6"]
# The application: settings, bootstrap, the `etl` command.
app = ["pydantic-settings>=2.6"]
# Logs (and later traces) exported by OpenTelemetry (OTLP).
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
all = [
    "etl-pipeline-boilerplate[http,mappings,gcs,postgres,mssql,oracle,mysql]",
    "etl-pipeline-boilerplate[mongodb,kafka,app,otel]",
    "etl-pipeline-boilerplate[gcp-secrets,azure-secrets]",
]

[project.scripts]
etl = "cli.run:main"
etl-db = "cli.database:main"
etl-mappings = "cli.mappings:main"

[dependency-groups]
dev = [
    { include-group = "tests" },
    { include-group = "coverage" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    "pre-commit>=4.0",
]
tests = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.120",
    # The optional extras, so that their adapters are tested too.
    "httpx>=0.28",
    "openpyxl>=3.1",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",
    "azure-keyvault-secrets>=4.8",
    "azure-identity>=1.17",
    "sqlalchemy>=2.0.41",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "mssql-python>=1.0",
    "oracledb>=2.5",
    "pymysql>=1.1",
    "pymongo>=4.10",
    "confluent-kafka>=2.6",
    "pydantic-settings>=2.6",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
coverage = ["coverage>=7.17.0", "pytest-cov>=7.1.0"]
lint = ["pyink>=24.10", "isort>=6.0", "pylint>=3.3"]
typecheck = ["mypy>=1.18", "pyright>=1.1.406", "types-openpyxl"]
tox = ["tox>=4.21", "tox-uv>=1.11"]
docs = [
    "docutils==0.22.4",
    "furo==2025.12.19",
    "myst-parser==5.1.0",
    "sphinx-copybutton==0.5.2",
    "sphinx==9.2.0",
    "sphinxcontrib-mermaid==2.1.1",
    "sphinxcontrib-programoutput==0.20",
]


[tool.hatch.build.targets.wheel]
packages = [
    "src/app",
    "src/cli",
    "src/config",
    "src/core",
    "src/infra",
    "src/modules",
    "src/shared",
]


# https://google.github.io/styleguide/pyguide.html

[tool.pyink]
line-length = 80
target-version = ["py314"]
pyink-indentation = 4
# Splits long strings and hugs brackets, so that 80 columns stay readable.
unstable = true
include = '\.pyi?$'
extend-exclude = '''
    \.eggs
    | \.git
    | \.venv
    | build
    | dist
'''

[tool.isort]
profile = "google"
line_length = 80
# Wrap the few multi-name imports (typing, collections.abc) the way pyink does.
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
src_paths = ["src", "tests"]
known_first_party = [
    "cli",
    "config",
    "core",
    "infra",
    "modules",
    "shared",
    "tests",
]
skip_gitignore = true


# Based on Google's pylintrc, with 4-space indentation.

[tool.pylint.main]
py-version = "3.14"
jobs = 0
source-roots = ["src", "."]
load-plugins = ["pylint.extensions.docparams"]

[tool.pylint.format]
max-line-length = 80
indent-string = "    "
ignore-long-lines = '^\s*(# )?<?https?://\S+>?$|^\s*(from\s+\S+\s+)?import\s+.+$'

[tool.pylint.basic]
good-names = ["main", "_", "i", "j", "k", "fn"]
# PEP 695 type parameters: T, TIn, TOut...
typevar-rgx = "^([A-Z]|T[A-Za-z]+)$"
no-docstring-rgx = "(__.*__|main|test.*|.*test|.*Test)$"
docstring-min-length = 12

[tool.pylint.parameter_documentation]
default-docstring-type = "google"
# A docstring does not have to list every argument, but the ones it lists must
# match the signature.
accept-no-param-doc = true
accept-no-raise-doc = true
accept-no-return-doc = true
accept-no-yields-doc = true

[tool.pylint.design]
# Constructors take their options keyword-only: arguments are counted, but
# positional ones stay few.
max-args = 10
max-positional-arguments = 6
# Dataclasses count their fields as attributes.
max-attributes = 20
max-locals = 20
# A `match` returning per case reads better than one exit.
max-returns = 10
max-branches = 12
max-statements = 50

[tool.pylint.similarities]
min-similarity-lines = 8
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pylint.messages_control]
disable = [
    # Ports, value objects and strategies have one method, or none.
    "too-few-public-methods",
    # mypy wants the `return None` of a function that may return something.
    "useless-return",
    "fixme",
    # Type checkers (mypy, pyright) own these.
    "import-error",
    "no-member",
    "no-name-in-module",
    # isort owns import order.
    "wrong-import-order",
    "ungrouped-imports",
    # Type checkers need `...` as the body of Protocol members, even after a
    # docstring.
    "unnecessary-ellipsis",
]


[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "benchmarks"]
# `typings/` holds stubs for untyped third-party libraries.
mypy_path = "src,typings"
# `tests/` has no `__init__.py`; resolve its modules from the repo root.
explicit_package_bases = true
strict = true
warn_unreachable = true
implicit_reexport = true
show_error_codes = true
show_column_numbers = true
# Resources are asked for by port, an abstract class checked with isinstance:
# `resources.get(names.STATE, contract.IStateStore)`.
disable_error_code = ["type-abstract"]

[tool.pyright]
include = ["src", "tests", "benchmarks"]
extraPaths = ["src"]
stubPath = "typings"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = "error"
# The core has no third-party library to blame for an unknown type.
strict = ["src/core"]


[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: end-to-end and chaos tests, running the `etl` command (-m 'not slow' skips them)",
]

[tool.coverage.run]
branch = true
source = ["src"]
# The `etl` processes of the end-to-end tests count too: coverage starts in
# every Python subprocess (its .pth file), and pytest-cov combines their data.
patch = ["subprocess"]
# Paths relative to the repository in the XML report, so that Sonar finds
# the files wherever it runs.
relative_files = true

[tool.coverage.report]
# No floor here: the SQLite tests alone leave much of the database adapters
# unrun, so the floor applies only where every database is up (`make
# cov-db`, CI's test steps, `--cov-fail-under`).
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    '^\s*\.\.\.$',
]

[tool.tox]
requires = ["tox>=4.21", "tox-uv>=1.11"]
env_list = ["lint", "type", "3.14"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["tests", "coverage"]
commands = [["pytest", "--cov", { replace = "posargs", extend = true }]]

# As `make lint`: tests, scripts and benchmarks with its TESTS_PYLINT flags.
[tool.tox.env.lint]
dependency_groups = ["lint"]
commands = [
    ["pyink", "--check", "src", "tests", "scripts", "benchmarks"],
    ["isort", "--check-only", "src", "tests", "scripts", "benchmarks"],
    ["pylint", "src"],
    [
        "pylint",
        "--disable=missing-docstring,redefined-outer-name",
        "--disable=unused-argument,protected-access,duplicate-code",
        "--disable=too-many-locals,use-implicit-booleaness-not-comparison",
        "--disable=unbalanced-tuple-unpacking",
        "tests",
        "scripts",
        "benchmarks",
    ],
]

[tool.tox.env.type]
dependency_groups = ["typecheck", "tests"]
commands = [["mypy"], ["pyright"]]
